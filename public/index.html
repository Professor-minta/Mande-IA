<!doctype html>
<html lang="bm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5d43" />
    <title>Mande-IA | I ka kuma i ka telefoni fɛ</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header><p class="eyebrow">MALI • BAMANANKAN</p><h1>Mande-IA</h1><p class="tagline">I ka kuma i ka telefoni fɛ.</p></header>
      <section id="chat" class="chat" aria-live="polite">
        <article class="message assistant">Aw ni ce! N ye Mande-IA ye. I bɛ se ka n mafɔ mun na?</article>
      </section>
      <form id="composer" class="composer">
        <label class="sr-only" for="message">I ka kuma</label>
        <textarea id="message" rows="2" maxlength="2000" placeholder="I ka kuma yan... / Parlez ici..."></textarea>
        <div class="actions"><button id="listen" class="secondary" type="button" aria-pressed="false">🎙️ Fɔ</button><button type="submit">Ciya</button></div>
      </form>
      <p id="status" class="status">Aw bɛna fɔli minɛ ni i browser b’a dɛmɛ.</p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
